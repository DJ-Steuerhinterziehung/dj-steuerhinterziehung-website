<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex,nofollow,noarchive,nosnippet,noimageindex">
  <meta name="theme-color" content="#09090b">
  <title>Privater Katalog</title>
  <style>
    *{box-sizing:border-box}
    body{margin:0;min-height:100vh;display:grid;place-items:center;padding:24px;color:#f7f7f8;background:radial-gradient(circle at 50% 0,rgba(124,58,237,.28),transparent 32rem),#09090b;font-family:Inter,system-ui,sans-serif}
    main{width:min(100%,440px);padding:30px;border:1px solid rgba(255,255,255,.14);border-radius:24px;background:rgba(255,255,255,.055);box-shadow:0 30px 100px rgba(0,0,0,.55)}
    .dot{width:12px;height:12px;margin-bottom:22px;border-radius:50%;background:#b7ff45;box-shadow:0 0 24px #b7ff45}
    h1{margin:0 0 12px;font-size:2.15rem;letter-spacing:-.05em}
    p{margin:0;color:#aaaab6;line-height:1.55}
  </style>
</head>
<body>
  <main>
    <div class="dot"></div>
    <h1>Privater Katalog</h1>
    <p id="status">Katalog wird geladen …</p>
  </main>
  <script>
    const release = Date.now().toString(36);
    const files = Array.from({length:20},(_,i)=>`payload-${String(i).padStart(2,"0")}.dat`);
    Promise.all(files.map(async file=>{
      const response = await fetch(`${file}?v=${release}`,{cache:"no-store"});
      if(!response.ok) throw new Error(`HTTP ${response.status}`);
      return response.text();
    })).then(parts=>{
      document.open();
      document.write(parts.join(""));
      document.close();
    }).catch(()=>{
      document.getElementById("status").textContent="Der Katalog konnte nicht geladen werden. Bitte öffne den Link erneut.";
    });
  </script>
</body>
</html>
